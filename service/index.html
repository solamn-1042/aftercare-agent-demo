<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aftercare · 售后服务助手</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#182339;font:16px/1.7 system-ui,sans-serif}main{max-width:1100px;margin:40px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:5px 0;font-size:32px}small{color:#66758b}.tag{background:#dce9ff;padding:5px 12px;border-radius:20px;color:#254d92}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-top:24px}.card{background:white;border:1px solid #dde3ed;border-radius:16px;padding:24px}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #b9c4d5;border-radius:8px;padding:12px;margin:8px 0}textarea{height:120px}button{background:#2858c7;color:white;border:0;border-radius:8px;padding:10px 24px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.7 system-ui}#status{color:#315494;margin-left:12px}.evidence{border-left:3px solid #6f91d9;padding:8px 12px;margin:12px 0;background:#f7f9fd}.trace{color:#64748b;font-size:13px}@media(max-width:750px){.grid{grid-template-columns:1fr}header{display:block}}
</style><main><header><div><small>ENGINEERING PORTFOLIO / RAG WORKFLOW</small><h1>售后服务助手</h1><small>检索来源、回答依据与执行路径，一起呈现。</small></div><span class="tag">LangGraph + Chroma</span></header><div class="grid"><section class="card"><label>访问令牌<input id="token" type="password" placeholder="输入部署时配置的 API_TOKEN" autocomplete="off"></label><label>你的问题<textarea id="q">A002 的退款状态如何？退款一般多久到账？</textarea></label><button id="send">检索并回答</button><span id="status">等待提问</span><h3>回答</h3><pre id="answer">输入问题后，这里会展示回答或明确的证据不足提示。</pre><div class="trace" id="trace"></div></section><section class="card"><h3>证据片段</h3><small>引用校验检查来源 ID，不代表答案事实已经人工审核。</small><div id="evidence"></div></section></div></main><script>
const byId=id=>document.getElementById(id);byId('send').onclick=async()=>{byId('send').disabled=true;byId('status').textContent='处理中…';try{const r=await fetch('/v1/ask',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+byId('token').value},body:JSON.stringify({question:byId('q').value})});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'请求参数无效');byId('status').textContent=d.status+' · '+d.elapsed_ms+' ms';byId('answer').textContent=d.answer;byId('trace').textContent=d.trace.map(x=>x.node).join(' → ')+' | '+d.request_id;byId('evidence').replaceChildren();for(const h of d.hits){let node=document.createElement('div');node.className='evidence';let title=document.createElement('strong');title.textContent=h.chunk_id;let text=document.createElement('pre');text.textContent=h.text;node.append(title,text);byId('evidence').append(node)}}catch(e){byId('status').textContent='请求失败';byId('answer').textContent=e.message}finally{byId('send').disabled=false}};
</script></html>
